<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看影片學雙語（台語，英文）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 卡片基本樣式與懸停效果 */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px); /* 向上移動一點 */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* 增加陰影 */
        }
        /* 答對時的醒目效果 (動畫 + 背景色) */
        .correct-answer {
            animation: correctPulse 0.6s ease;
            background-color: #a7f3d0 !important; /* 淺綠色 */
            border-color: #059669 !important; /* 深綠色 */
        }
        /* 答錯時的醒目效果 (動畫 + 背景色) */
        .incorrect-answer {
             animation: incorrectShake 0.6s ease;
             background-color: #fee2e2 !important; /* 淺紅色 */
             border-color: #ef4444 !important; /* 深紅色 */
        }
        /* 顯示正確答案時的高亮樣式 */
         .highlight-correct {
            background-color: #a7f3d0 !important; /* 淺綠色 */
            border: 2px solid #059669 !important; /* 深綠色邊框 */
         }

        /* 答對時的脈衝動畫 */
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* 答錯時的搖晃動畫 */
         @keyframes incorrectShake {
             0%, 100% { transform: translateX(0); }
             25% { transform: translateX(-5px); }
             75% { transform: translateX(5px); }
         }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div id="quiz-container" class="bg-white rounded-lg shadow-xl p-6 md:p-8 w-full max-w-3xl">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-2">看影片學雙語（台語，英文）</h1>
        <p class="text-base font-bold text-center text-gray-700 mb-1">遊戲創建人：Gloria吳秀蘭老師</p>
        <p class="text-sm text-center text-gray-600 mb-1">Google認證講師，台語認證高級證書英語間台語教師</p>
        <p class="text-sm text-center text-blue-600 hover:underline mb-4">
            參考影片：<a href="https://youtu.be/PrF6aT8mi_c?si=SUJtXRbfiitB2kU1”此訊息中的網址，改為“參考影片：請按連結（加上超連結效果）" target="_blank" rel="noopener noreferrer">請按連結</a>
        </p>

        <div id="quiz-area">
            <div id="progress-bar" class="w-full bg-gray-200 rounded-full h-2.5 mb-4 dark:bg-gray-700">
                <div id="progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="round-info" class="text-center font-semibold text-lg text-indigo-700 mb-4"></p>
            <p id="score" class="text-center font-semibold text-lg text-green-700 mb-4">分數: 0</p>

            <div id="question-card" class="bg-indigo-100 border border-indigo-300 rounded-lg p-4 md:p-6 mb-6 text-center">
                <p class="text-gray-600 mb-2 text-sm hidden" id="question-type"></p>
                <p id="question" class="text-xl md:text-2xl font-semibold text-indigo-900"></p>
            </div>

            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>

            <div id="feedback" class="mt-4 text-center font-medium h-6"></div>
            <button id="next-button" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300 hidden">下一題</button>
        </div>

        <div id="results-area" class="hidden text-center">
             <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-4">測驗結果</h2>
             <div id="round1-results" class="mb-4"></div>
             <div id="round2-results" class="mb-4"></div>
             <div id="round3-results" class="mb-4"></div>
             <p id="final-score" class="text-lg font-semibold mt-4"></p>
             <button id="restart-button" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-300">重新開始</button>
        </div>
    </div>

    <script>
        // 資料來源：台語漢字、拼音、英文翻譯
        const words = [
            { hanzi: "保險業務員", pinyin: "Pó-hiám gia̍p-bū-uân", english: "Insurance agent" },
            { hanzi: "醫療意外險", pinyin: "I-liâu ì-guā-hiám", english: "Medical accident insurance" },
            { hanzi: "車禍", pinyin: "Chhia-hō", english: "Car accident" },
            { hanzi: "住院", pinyin: "Tsū-īnn", english: "Hospitalization" },
            { hanzi: "補助", pinyin: "Hú-tsōo", english: "Subsidy" },
            { hanzi: "朋友", pinyin: "Pîng-iú", english: "Friend" },
            { hanzi: "親戚", pinyin: "Tshin-tsheh", english: "Relatives" },
            { hanzi: "手指頭", pinyin: "Tshiú-tsí-thâu", english: "Finger" },
            { hanzi: "家庭", pinyin: "Ka-tîng", english: "Family" },
            { hanzi: "生活", pinyin: "Sing-ua̍h", english: "Life" }
        ];

        // 遊戲狀態變數
        let currentRound = 1; // 目前階段 (1: 台語->英, 2: 英->台語, 3: 台語->拼音)
        let currentQuestionIndex = 0; // 目前題號 (從 0 開始)
        let score = 0; // 分數
        let questionsRound1 = []; // 第一階段題目 (台語->英)
        let questionsRound2 = []; // 第二階段題目 (英->台語)
        let questionsRound3 = []; // 第三階段題目 (台語->拼音)
        let round1Answers = []; // 儲存第一階段的作答記錄 { question, correctAnswer, userAnswer, isCorrect }
        let round2Answers = []; // 儲存第二階段的作答記錄
        let round3Answers = []; // 儲存第三階段的作答記錄
        let optionsDisabled = false; // 控制選項是否可點擊 (防止重複點擊)

        // 獲取 DOM 元素
        const quizArea = document.getElementById('quiz-area');
        const resultsArea = document.getElementById('results-area');
        const roundInfo = document.getElementById('round-info');
        const scoreDisplay = document.getElementById('score');
        // const questionTypeDisplay = document.getElementById('question-type'); // 雖然隱藏了，但 JS 可能仍需引用
        const questionDisplay = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackDisplay = document.getElementById('feedback');
        const nextButton = document.getElementById('next-button');
        const restartButton = document.getElementById('restart-button');
        const progressBar = document.getElementById('progress');
        const round1ResultsDiv = document.getElementById('round1-results'); // 獲取結果顯示區域的元素
        const round2ResultsDiv = document.getElementById('round2-results');
        const round3ResultsDiv = document.getElementById('round3-results');
        const finalScoreDisplay = document.getElementById('final-score');


        // Fisher-Yates (aka Knuth) Shuffle 洗牌演算法：用於打亂陣列順序
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1)); // 隨機選一個前面的元素
                [array[i], array[j]] = [array[j], array[i]]; // 交換元素
            }
            return array;
        }

         // 產生包含一個正確答案和三個干擾項的選項陣列
         function generateOptions(correctAnswer, type) {
             let options = [correctAnswer]; // 先放入正確答案
             let distractors = [];

             // 根據類型 (english, hanzi, pinyin) 取得所有可能的選項，並排除正確答案
             if (type === 'english') {
                 distractors = words.map(w => w.english).filter(item => item !== correctAnswer);
             } else if (type === 'hanzi') {
                 distractors = words.map(w => w.hanzi).filter(item => item !== correctAnswer);
             } else if (type === 'pinyin') {
                 distractors = words.map(w => w.pinyin).filter(item => item !== correctAnswer);
             }

             shuffleArray(distractors); // 打亂干擾項順序

             // 從打亂的干擾項中取出，直到選項達到 4 個
             while (options.length < 4 && distractors.length > 0) {
                 const distractor = distractors.pop();
                 if (!options.includes(distractor)) { // 避免重複選項
                     options.push(distractor);
                 }
             }
             // 如果干擾項不足（例如總詞彙量很少），則隨機選取詞彙補充，確保總有 4 個選項
             while (options.length < 4) {
                 const randomWord = words[Math.floor(Math.random() * words.length)];
                 let potentialOption;
                 if (type === 'english') {
                     potentialOption = randomWord.english;
                 } else if (type === 'hanzi') {
                     potentialOption = randomWord.hanzi;
                 } else if (type === 'pinyin') {
                     potentialOption = randomWord.pinyin;
                 }

                 if (!options.includes(potentialOption)) {
                     options.push(potentialOption);
                 }
             }

             return shuffleArray(options); // 最後再打亂一次包含正確答案的選項陣列
         }

        // 顯示目前的問題和選項
        function displayQuestion() {
            optionsDisabled = false; // 重設選項為可點擊
            feedbackDisplay.textContent = ''; // 清空上一題的回饋
            feedbackDisplay.className = 'mt-4 text-center font-medium h-6'; // 重設回饋樣式
            optionsContainer.innerHTML = ''; // 清空上一題的選項按鈕
            nextButton.classList.add('hidden'); // 隱藏下一題按鈕

            // 根據目前階段選擇題目來源和問題類型
            let currentQuestions;
            let answerType;
            let roundTitle;

            if (currentRound === 1) {
                currentQuestions = questionsRound1;
                answerType = 'english';
                roundTitle = '第一階段：台語漢字 ➡️ 英文';
            } else if (currentRound === 2) {
                currentQuestions = questionsRound2;
                answerType = 'hanzi';
                roundTitle = '第二階段：英文 ➡️ 台語漢字';
            } else if (currentRound === 3) {
                currentQuestions = questionsRound3;
                answerType = 'pinyin';
                roundTitle = '第三階段：台語漢字 ➡️ 台羅拼音';
            }


            // 檢查是否完成該階段所有題目
            if (currentQuestionIndex >= currentQuestions.length) {
                if (currentRound < 3) {
                    // 如果不是最後一階段，顯示該階段結果並準備下一階段
                    if (currentRound === 1) {
                        displayRoundResults(1, round1Answers, roundTitle);
                    } else if (currentRound === 2) {
                        displayRoundResults(2, round2Answers, roundTitle);
                    }
                } else {
                    // 如果是最後一階段，顯示最終結果
                     displayFinalResults();
                }
                return; // 結束函式執行
            }

            // 獲取當前問題的資料
            const questionData = currentQuestions[currentQuestionIndex];
            // 更新介面顯示：階段、題號、問題本身
            roundInfo.textContent = `${roundTitle} - 題目 ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            questionDisplay.textContent = questionData.question;

            // 產生選項 (包含正確答案和干擾項)
            const options = generateOptions(questionData.correctAnswer, answerType);

            // 創建選項按鈕並添加到容器中
            options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                // 添加 Tailwind CSS 樣式和自訂 'card' 樣式
                button.classList.add('card', 'bg-white', 'border', 'border-gray-300', 'rounded-lg', 'p-4', 'text-center', 'hover:bg-gray-100', 'focus:outline-none', 'focus:ring-2', 'focus:ring-blue-500', 'focus:ring-opacity-50', 'transition', 'duration-150', 'ease-in-out');
                // 設定按鈕點擊事件
                button.onclick = () => selectAnswer(option, questionData.correctAnswer, button);
                optionsContainer.appendChild(button);
            });

            // 更新進度條
            const totalQuestions = questionsRound1.length + questionsRound2.length + questionsRound3.length;
            let completedQuestions = 0;
            if (currentRound === 1) {
                completedQuestions = currentQuestionIndex;
            } else if (currentRound === 2) {
                completedQuestions = questionsRound1.length + currentQuestionIndex;
            } else if (currentRound === 3) {
                 completedQuestions = questionsRound1.length + questionsRound2.length + currentQuestionIndex;
            }
            // 計算進度百分比 (顯示已完成的題目比例)
            const progressPercentage = (completedQuestions / totalQuestions) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // 處理玩家選擇答案的邏輯
        function selectAnswer(selectedOption, correctAnswer, button) {
             if (optionsDisabled) return; // 如果選項已被禁用 (已作答)，則不執行任何操作
             optionsDisabled = true; // 禁用選項，防止重複點擊

            const isCorrect = selectedOption === correctAnswer; // 判斷答案是否正確
             // 記錄作答資訊
             const answerRecord = {
                 question: (currentRound === 1 ? questionsRound1 : (currentRound === 2 ? questionsRound2 : questionsRound3))[currentQuestionIndex].question,
                 correctAnswer: correctAnswer,
                 userAnswer: selectedOption,
                 isCorrect: isCorrect
             };

             // 將作答記錄存儲到對應階段的陣列中
             if (currentRound === 1) {
                 round1Answers.push(answerRecord);
             } else if (currentRound === 2) {
                 round2Answers.push(answerRecord);
             } else if (currentRound === 3) {
                 round3Answers.push(answerRecord);
             }


             // 禁用所有選項按鈕，並提供視覺回饋
             const buttons = optionsContainer.querySelectorAll('button');
             buttons.forEach(btn => {
                 btn.disabled = true; // 禁用按鈕
                  // 無論對錯，都高亮顯示正確答案
                  if (btn.textContent === correctAnswer) {
                      btn.classList.add('highlight-correct'); // 添加高亮樣式
                  }
                  // 根據選擇的按鈕和答案是否正確，應用不同的樣式和動畫
                  if (btn === button) { // 如果是玩家點擊的那個按鈕
                      if (isCorrect) {
                          btn.classList.remove('hover:bg-gray-100'); // 移除懸停效果
                          btn.classList.add('correct-answer'); // 添加答對的樣式和動畫
                          feedbackDisplay.textContent = '答對了！ 🎉'; // 顯示答對訊息
                          feedbackDisplay.classList.add('text-green-600'); // 設置文字顏色為綠色
                          score++; // 分數增加
                      } else {
                          btn.classList.remove('hover:bg-gray-100'); // 移除懸停效果
                          btn.classList.add('incorrect-answer'); // 添加答錯的樣式和動畫
                          // 顯示答錯訊息，並提示正確答案
                          feedbackDisplay.innerHTML = `答錯了！😟 正確答案是：<strong class="text-blue-700">${correctAnswer}</strong>`;
                          feedbackDisplay.classList.add('text-red-600'); // 設置文字顏色為紅色
                      }
                  } else {
                       // 對於其他未被選中且不是正確答案的按鈕，稍微降低透明度
                       if (btn.textContent !== correctAnswer) {
                          btn.classList.add('opacity-60');
                       }
                  }
             });


            scoreDisplay.textContent = `分數: ${score}`; // 更新分數顯示
            nextButton.classList.remove('hidden'); // 顯示「下一題」按鈕
        }

        // 「下一題」按鈕的點擊事件監聽器
        nextButton.addEventListener('click', () => {
             currentQuestionIndex++; // 題號加 1
             displayQuestion(); // 顯示下一題
        });

         // 顯示各階段的作答結果摘要
         function displayRoundResults(round, answers, title) {
             quizArea.classList.add('hidden'); // 隱藏測驗區域
             resultsArea.classList.remove('hidden'); // 顯示結果區域
             restartButton.classList.add('hidden'); // 在階段結果頁隱藏重新開始按鈕

             let resultsDiv;
             if (round === 1) {
                 resultsDiv = round1ResultsDiv;
             } else if (round === 2) {
                 resultsDiv = round2ResultsDiv;
             }

             // 清空前一階段的詳細結果顯示 (如果存在)
             if (round === 2) {
                 round1ResultsDiv.innerHTML = ''; // 清空第一階段的詳細結果
             }
             round2ResultsDiv.innerHTML = ''; // 清空第二階段的詳細結果
             round3ResultsDiv.innerHTML = ''; // 清空第三階段的詳細結果


             // 顯示標題和答對題數
             resultsDiv.innerHTML = `<h3 class="text-lg font-semibold mb-3 text-indigo-700">${title} 摘要: ${answers.filter(a => a.isCorrect).length}/${answers.length} 答對</h3>`;

             // 添加詳細的作答結果
             answers.forEach((ans, index) => {
                 const resultClass = ans.isCorrect ? 'text-green-600' : 'text-red-600'; // 根據對錯設置文字顏色
                 const symbol = ans.isCorrect ? '✔️' : '❌'; // 根據對錯設置符號
                 // 如果答錯，顯示玩家選擇的答案
                 const userAnswerDisplay = ans.isCorrect ? '' : ` (您選了: ${ans.userAnswer})`;
                 // 添加每題的結果到顯示區域
                 resultsDiv.innerHTML += `
                     <div class="mb-2 p-2 border-b border-gray-200 text-left ${ans.isCorrect ? 'bg-green-50' : 'bg-red-50'} rounded">
                         <p>${index + 1}. ${ans.question} ➡️ ${ans.correctAnswer} <span class="${resultClass}">${symbol}${userAnswerDisplay}</span></p>
                     </div>
                 `;
             });


             // 添加進入下一階段的按鈕
             let nextRoundButton;
             if (round === 1) {
                 nextRoundButton = document.createElement('button');
                 nextRoundButton.id = 'start-round2-button';
                 nextRoundButton.textContent = '開始第二階段';
                 nextRoundButton.classList.add('mt-4', 'bg-purple-600', 'hover:bg-purple-700', 'text-white', 'font-bold', 'py-2', 'px-4', 'rounded', 'transition', 'duration-300');
                 nextRoundButton.addEventListener('click', startRound2);
                 resultsDiv.appendChild(nextRoundButton);
             } else if (round === 2) {
                 nextRoundButton = document.createElement('button');
                 nextRoundButton.id = 'start-round3-button';
                 nextRoundButton.textContent = '開始第三階段';
                 nextRoundButton.classList.add('mt-4', 'bg-teal-600', 'hover:bg-teal-700', 'text-white', 'font-bold', 'py-2', 'px-4', 'rounded', 'transition', 'duration-300');
                 nextRoundButton.addEventListener('click', startRound3);
                 resultsDiv.appendChild(nextRoundButton);
             }


             finalScoreDisplay.textContent = `目前分數: ${score}`; // 顯示階段結束時的分數

         }

         // 開始第二階段的函式
         function startRound2() {
             currentRound = 2; // 將階段設為 2
             currentQuestionIndex = 0; // 重設題號為 0
              progressBar.style.width = `0%`; // 重設進度條
             resultsArea.classList.add('hidden'); // 隱藏結果區域
             quizArea.classList.remove('hidden'); // 重新顯示測驗區域
             displayQuestion(); // 開始顯示第二階段的第一題
         }

        // 開始第三階段的函式
         function startRound3() {
             currentRound = 3; // 將階段設為 3
             currentQuestionIndex = 0; // 重設題號為 0
              progressBar.style.width = `0%`; // 重設進度條
             resultsArea.classList.add('hidden'); // 隱藏結果區域
             quizArea.classList.remove('hidden'); // 重新顯示測驗區域
             displayQuestion(); // 開始顯示第三階段的第一題
         }


         // 顯示最終的測驗結果
         function displayFinalResults() {
             quizArea.classList.add('hidden'); // 隱藏測驗區域
             resultsArea.classList.remove('hidden'); // 顯示結果區域
             restartButton.classList.remove('hidden'); // 顯示重新開始按鈕

             // 清空所有階段的詳細結果顯示
             round1ResultsDiv.innerHTML = '';
             round2ResultsDiv.innerHTML = '';
             round3ResultsDiv.innerHTML = '';

              // 顯示第一階段的摘要 (只顯示答對題數)
              round1ResultsDiv.innerHTML = `<h3 class="text-lg font-semibold mb-3 text-indigo-700">第一階段摘要: ${round1Answers.filter(a => a.isCorrect).length}/${round1Answers.length} 答對</h3>`;

              // 顯示第二階段的摘要 (只顯示答對題數)
              round2ResultsDiv.innerHTML = `<h3 class="text-lg font-semibold mb-3 mt-4 text-teal-700">第二階段摘要: ${round2Answers.filter(a => a.isCorrect).length}/${round2Answers.length} 答對</h3>`;

             // 顯示第三階段的詳細作答結果
             round3ResultsDiv.innerHTML = `<h3 class="text-lg font-semibold mb-3 mt-4 text-teal-700">第三階段作答結果 (${round3Answers.filter(a => a.isCorrect).length}/${round3Answers.length})</h3>`;
             round3Answers.forEach((ans, index) => {
                  const resultClass = ans.isCorrect ? 'text-green-600' : 'text-red-600';
                  const symbol = ans.isCorrect ? '✔️' : '❌';
                  const userAnswerDisplay = ans.isCorrect ? '' : ` (您選了: ${ans.userAnswer})`;
                   round3ResultsDiv.innerHTML += `
                       <div class="mb-2 p-2 border-b border-gray-200 text-left ${ans.isCorrect ? 'bg-green-50' : 'bg-red-50'} rounded">
                           <p>${index + 1}. ${ans.question} ➡️ ${ans.correctAnswer} <span class="${resultClass}">${symbol}${userAnswerDisplay}</span></p>
                       </div>
                   `;
             });

             // 顯示最終總分
             document.getElementById('final-score').textContent = `總分: ${score} / ${words.length * 3}`; // 總分是三階段題目數總和
         }

        // 「重新開始」按鈕的點擊事件監聽器
        restartButton.addEventListener('click', startQuiz);

        // 初始化並開始測驗的函式
        function startQuiz() {
             // 重設所有遊戲狀態變數
             currentRound = 1;
             currentQuestionIndex = 0;
             score = 0;
             round1Answers = [];
             round2Answers = [];
             round3Answers = [];
             optionsDisabled = false;

             // 準備第一階段題目 (台語->英)
             let tempWordsRound1 = shuffleArray([...words]); // 複製並打亂詞彙陣列
             questionsRound1 = tempWordsRound1.map(word => ({
                 question: word.hanzi, // 問題是台語漢字
                 correctAnswer: word.english // 正確答案是英文
             }));

             // 準備第二階段題目 (英->台語)
             let tempWordsRound2 = shuffleArray([...words]); // 再次複製並打亂
              questionsRound2 = tempWordsRound2.map(word => ({
                  question: word.english, // 問題是英文
                  correctAnswer: word.hanzi // 正確答案是台語漢字
              }));

             // 準備第三階段題目 (台語->拼音)
             let tempWordsRound3 = shuffleArray([...words]); // 再次複製並打亂
             questionsRound3 = tempWordsRound3.map(word => ({
                 question: word.hanzi, // 問題是台語漢字
                 correctAnswer: word.pinyin // 正確答案是台羅拼音
             }));


             // 重設 UI 介面
             scoreDisplay.textContent = `分數: 0`;
              progressBar.style.width = '0%';
             resultsArea.classList.add('hidden'); // 隱藏結果區域
              round1ResultsDiv.innerHTML = ''; // 清空結果顯示
              round2ResultsDiv.innerHTML = '';
              round3ResultsDiv.innerHTML = '';
              finalScoreDisplay.textContent = ''; // 清空最終分數顯示
             quizArea.classList.remove('hidden'); // 顯示測驗區域

             // 開始顯示第一題
             displayQuestion();
        }

        // 頁面載入完成後，自動開始測驗
        startQuiz();
    </script>
</body>
</html>
